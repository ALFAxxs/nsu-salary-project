# /etc/nginx/sites-available/salary
server {
    listen 80;
    server_name example.com www.example.com;
    # Redirect all HTTP to HTTPS (certbot manages the 443 block).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 12M;   # matches MAX_UPLOAD_SIZE + headroom

    location /static/ {
        alias /opt/salary_system/staticfiles/;
        expires 30d;
    }
    location /media/ {
        internal;               # media served only via X-Accel-Redirect if needed
        alias /opt/salary_system/media/;
    }

    location / {
        proxy_pass http://unix:/run/salary.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
