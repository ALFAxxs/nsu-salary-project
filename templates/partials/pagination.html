{% if page.paginator.num_pages > 1 %}
<nav class="mt-3"><ul class="pagination pagination-sm">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% if search %}q={{ search }}&{% endif %}page={{ page.previous_page_number }}">‹</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% if search %}q={{ search }}&{% endif %}page={{ page.next_page_number }}">›</a></li>{% endif %}
</ul></nav>
{% endif %}
